<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500;1,8..60,600&amp;display=swap">
<style>
body{margin:0}
a{color:#0E1525;text-decoration:none}
a:hover{color:#2F5BB7;text-decoration:underline;text-underline-offset:3px}
</style>
</helmet>
<header style="font-family: 'Inter', system-ui, sans-serif; color: #0E1525; width: 100%">
<div style="background: #0B2A6B">
<div style="max-width: 1240px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.dc.html" aria-label="European SME home" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg aria-hidden="true" viewBox="0 0 200 200" style="width: 38px; height: 38px; fill: #FFC72C"><path transform="translate(180.0 100.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(169.3 140.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(140.0 169.3) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(100.0 180.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(60.0 169.3) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(30.7 140.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(20.0 100.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(30.7 60.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(60.0 30.7) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(100.0 20.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(140.0 30.7) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(169.3 60.0) scale(2.2)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path></svg>
<span style="font-size: 24px; font-weight: 800; color: #FFFFFF; line-height: 1">EUROPEAN <span style="color: #FFC72C">SME</span></span>
</a>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Search" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
</button>
<a href="Main.dc.html#newsletter" style="background: #FFC72C; color: #071C4A; font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: 999px; text-decoration: none">Subscribe free</a>
</div>
</div>
</div>
<nav aria-label="Sections" style="background: #FFFFFF; border-bottom: 1px solid #DDE2EA">
<div style="max-width: 1240px; margin: 0 auto; padding: 0 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 22px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="10">
<a href="{{n.href}}" style="padding: 15px 0; font-size: 13.5px; font-weight: 600; color: {{n.color}}; box-shadow: {{n.bar}}">{{n.label}}</a>
</sc-for>
<a href="Tools.dc.html" style="margin-left: 6px; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700; background: {{toolsBg}}; color: {{toolsFg}}; border: 1px solid #0B2A6B">Tools</a>
</div>
</nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["none","Funding","Growth","Money","Marketing","Hiring","Trade","Tech","Policy","Startups","Countries","Tools"],"default":"none"},"$preview":{"width":1440,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'none';
    const list = [
      ['Funding', 'Funding', 'FundingFinder.dc.html'],
      ['Growth', 'Growth', '#'],
      ['Money', 'Money', '#'],
      ['Marketing', 'Marketing', '#'],
      ['Hiring', 'Hiring & Talent', '#'],
      ['Trade', 'Trade & Export', '#'],
      ['Tech', 'Tech & AI', '#'],
      ['Policy', 'EU Policy', 'Compliance.dc.html'],
      ['Startups', 'Startups', '#'],
      ['Countries', 'Countries', 'CountryHub.dc.html']
    ];
    return {
      items: list.map(([k, label, href]) => ({
        label, href,
        color: k === active ? '#2F5BB7' : '#0E1525',
        bar: k === active ? 'inset 0 -3px 0 #2F5BB7' : 'none'
      })),
      toolsBg: active === 'Tools' ? '#0B2A6B' : '#FFFFFF',
      toolsFg: active === 'Tools' ? '#FFFFFF' : '#0B2A6B'
    };
  }
}
</script>
</body>
</html>
