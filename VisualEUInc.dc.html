<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EU Inc. graphic</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Sora:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="esme.css">
<style>body{margin:0}</style>
</helmet>
<figure role="img" aria-label="EU Inc., the proposed 28th regime: one optional company form alongside the 27 national systems, with fully digital incorporation in 48 hours and an EU employee stock option scheme. Proposed 18 March 2026." style="margin: 0; width: 100%; aspect-ratio: 16 / 9; container-type: inline-size; background: #1E4FA8; border-radius: {{radius}}; overflow: hidden; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; color: #FFFFFF; box-sizing: border-box">
<div style="width: 100%; height: 100%; box-sizing: border-box; padding: 5cqw; display: flex; gap: 4cqw; align-items: stretch">
<div style="flex: 1 1 55%; display: flex; flex-direction: column; justify-content: space-between; min-width: 0">
<span style="font-size: 1.5cqw; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #FFC72C">The 28th regime</span>
<span style="font-family: 'Sora', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; line-height: 0.9; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 1.5cqw">
<span style="font-size: 17cqw">27</span>
<span style="font-size: 9cqw; color: #FFC72C">+1</span>
</span>
<span style="font-size: 1.9cqw; line-height: 1.4; color: #E6ECF7">27 national company laws, plus one optional EU-wide form: <strong style="color: #FFFFFF">EU Inc.</strong></span>
</div>
<div style="flex: 1 1 45%; display: flex; flex-direction: column; justify-content: center; gap: 1.6cqw; min-width: 0; border-left: 0.25cqw solid rgba(255,255,255,0.35); padding-left: 3.5cqw">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 0.4cqw">
<span style="font-family: 'Sora', 'Helvetica Neue', Arial, sans-serif; font-size: 3cqw; font-weight: 600; line-height: 1.1">{{f.big}}</span>
<span style="font-size: 1.55cqw; line-height: 1.35; color: #E6ECF7">{{f.small}}</span>
</div>
</sc-for>
</div>
</div>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"radius":{"editor":"text","default":"8px"},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      radius: this.props.radius ?? '8px',
      facts: [
        { big: '48 hours', small: 'Fully digital incorporation' },
        { big: 'Optional', small: 'Any company can opt in; national forms stay' },
        { big: 'EU-ESOs', small: 'Common employee stock option scheme' },
        { big: '18 Mar 2026', small: 'Commission proposal; deal sought by end-2026' }
      ]
    };
  }
}
</script>
</body>
</html>
