<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Sora:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="esme.css">
<style>
.esme-hdr{position:sticky;top:-37px;z-index:40;font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
.esme-top a{color:#C8CDD6;display:flex}
.esme-top a:hover{color:#FFFFFF}
.esme-bar{background:#FFFFFF;border-bottom:1px solid #E4E7EC;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.esme-nav{display:flex;align-items:center;gap:2px}
.esme-nl{display:inline-flex;align-items:center;gap:5px;padding:8px 9px;border-radius:6px;border:none;background:none;font-family:'Sora','Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:600;color:#14181D;cursor:pointer;text-decoration:none;white-space:nowrap}
.esme-nl:hover{background:#F2F4F7;color:#14181D;text-decoration:none}
.esme-nl.is-on{color:#1E4FA8}
.esme-caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.75}
.esme-dd{position:relative}
.esme-ddm{display:none;position:absolute;left:0;top:100%;padding-top:8px;z-index:60}
.esme-dd:hover .esme-ddm,.esme-dd:focus-within .esme-ddm{display:block}
.esme-ddp{min-width:250px;background:#FFFFFF;border:1px solid #EAECF0;border-radius:12px;box-shadow:0 12px 32px -12px rgba(16,24,40,.25);padding:8px}
.esme-ddi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:#14181D;text-decoration:none}
.esme-ddi:hover{background:#F5F7FA;color:#1E4FA8;text-decoration:none}
.esme-ddi small{display:block;font-size:12.5px;font-weight:400;color:#5A6470;margin-top:2px}
.esme-search{display:flex;align-items:center;gap:8px;height:40px;width:170px;padding:0 12px;border:1px solid #D0D5DD;border-radius:8px;background:#F9FAFB;color:#667085}
.esme-search:focus-within{border-color:#1E4FA8;background:#FFFFFF;box-shadow:0 0 0 3px rgba(30,79,168,.12)}
.esme-search input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:14px;color:#14181D}
.esme-row{flex-wrap:nowrap}
.esme-row .esme-btn{flex:none}
@media (max-width: 1300px){.esme-search{display:none}}
@media (max-width: 1060px){.esme-adv{display:none}}
@media (max-width: 900px){.esme-row{flex-wrap:wrap}.esme-nav{order:3;width:100%;overflow-x:auto}}
</style>
</helmet>
<header class="esme-hdr">
<div class="esme-top" style="background: #101828; color: #C8CDD6; font-size: 12.5px">
<div style="max-width: 1232px; height: 37px; box-sizing: border-box; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<span style="display: flex; align-items: center; gap: 14px; white-space: nowrap; overflow: hidden"><strong style="color: #FFFFFF; font-weight: 600">{{today}}</strong><span aria-hidden="true" style="width: 1px; height: 14px; background: rgba(255,255,255,.25)"></span><span>Europe’s platform for small-business insight</span></span>
<span style="display: flex; align-items: center; gap: 14px">
<a href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.5c0-1.3-.02-3-1.83-3-1.83 0-2.1 1.43-2.1 2.9V21H9z"></path></svg></a>
<a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.75 15.02V8.98L15.5 12z"></path></svg></a>
<a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle></svg></a>
<a href="https://x.com/" target="_blank" rel="noopener" aria-label="X"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.2 2.3h3.4l-7.4 8.4 8.7 11.5h-6.8l-5.3-7-6.1 7H1.3l7.9-9L.8 2.3h7l4.8 6.4zm-1.2 17.9h1.9L7 4.2H5z"></path></svg></a>
</span>
</div>
</div>
<div class="esme-bar">
<div class="esme-row" style="max-width: 1232px; min-height: 80px; box-sizing: border-box; margin: 0 auto; padding: 12px 32px; display: flex; align-items: center; gap: 12px 14px">
<a href="Main.dc.html" aria-label="European SME home" style="display: flex; align-items: center; gap: 9px; text-decoration: none; flex: none">
<svg aria-hidden="true" viewBox="0 0 200 200" style="width: 38px; height: 38px"><circle cx="100" cy="100" r="100" fill="#003399"></circle><g fill="#FFC72C"><path transform="translate(180.0 100.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(169.3 140.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(140.0 169.3) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(100.0 180.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(60.0 169.3) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(30.7 140.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(20.0 100.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(30.7 60.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(60.0 30.7) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(100.0 20.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(140.0 30.7) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path><path transform="translate(169.3 60.0) scale(1.55)" d="M0,-7 L1.65,-2.27 L6.66,-2.16 L2.66,0.87 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.66,0.87 L-6.66,-2.16 L-1.65,-2.27Z"></path></g></svg>
<span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1">
<span style="font-family: 'Sora', 'Helvetica Neue', Arial, sans-serif; font-size: 24px; letter-spacing: -0.01em; color: #14181D"><span style="font-weight: 500">EUROPEAN</span><span style="font-weight: 700; color: #003399">SME</span></span>
<span style="margin-top: 3px; font-family: 'Sora', 'Helvetica Neue', Arial, sans-serif; font-size: 6.5px; font-weight: 700; letter-spacing: 0.12em; color: #003399">BUSINESS MAGAZINE</span>
</span>
</a>
<nav aria-label="Main" class="esme-nav">
<a class="esme-nl {{latestOn}}" href="Articles.dc.html">Latest</a>
<div class="esme-dd">
<button type="button" class="esme-nl {{sectionsOn}}" aria-haspopup="true">Sections <span class="esme-caret"></span></button>
<div class="esme-ddm"><div class="esme-ddp">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="7">
<a class="esme-ddi" href="{{s.href}}"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: {{s.color}}; flex: none"></span>{{s.label}}</a>
</sc-for>
</div></div>
</div>
<div class="esme-dd">
<button type="button" class="esme-nl {{toolsOn}}" aria-haspopup="true">Tools <span class="esme-caret"></span></button>
<div class="esme-ddm"><div class="esme-ddp" style="min-width: 290px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
<a class="esme-ddi" href="{{t.href}}"><span><strong style="font-weight: 600">{{t.label}}</strong><small>{{t.desc}}</small></span></a>
</sc-for>
</div></div>
</div>
<a class="esme-nl {{countriesOn}}" href="CountryHub.dc.html">Countries</a>
<a class="esme-nl {{policyOn}}" href="Articles.dc.html?section=policy">EU Policy</a>
</nav>
<span style="flex: 1 1 0"></span>
<form class="esme-search" action="Articles.dc.html" method="get" role="search">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="hdr-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search articles</label>
<input id="hdr-q" name="q" type="search" placeholder="Search the site">
</form>
<a class="esme-btn esme-btn--blue esme-adv" href="#advertise">Advertise With Us</a>
<a class="esme-btn esme-btn--gold" href="Main.dc.html#newsletter">Subscribe Free</a>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["none","Articles","Funding","Growth","Money","Marketing","Hiring","Tech","Policy","Countries","Tools"],"default":"none"},"$preview":{"width":1440,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'none';
    const S = (typeof ESME !== 'undefined' && ESME.sections) || {};
    const sections = Object.keys(S).map((k) => ({ label: S[k].label, color: S[k].color, href: 'Articles.dc.html?section=' + k }));
    const inSection = ['Funding', 'Growth', 'Money', 'Marketing', 'Hiring', 'Tech'].indexOf(active) > -1;
    return {
      today: new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
      sections,
      tools: [
        { label: 'EU Funding Finder', desc: 'Grants, loans and equity by country', href: 'FundingFinder.dc.html' },
        { label: 'Compliance Calendar', desc: 'Every EU deadline that applies to you', href: 'Compliance.dc.html' },
        { label: 'Calculators', desc: 'VAT and late-payment interest', href: 'Calculators.dc.html' },
        { label: 'Checkers', desc: 'Am I an SME? Do I need e-invoicing?', href: 'Checkers.dc.html' },
        { label: 'All tools', desc: 'The full SME toolkit', href: 'Tools.dc.html' }
      ],
      latestOn: active === 'Articles' ? 'is-on' : '',
      sectionsOn: inSection ? 'is-on' : '',
      toolsOn: active === 'Tools' ? 'is-on' : '',
      countriesOn: active === 'Countries' ? 'is-on' : '',
      policyOn: active === 'Policy' ? 'is-on' : ''
    };
  }
}
</script>
</body>
</html>
