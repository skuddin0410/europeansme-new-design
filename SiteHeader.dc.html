<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Sora:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="esme.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
.esme-hdr{position:sticky;top:-37px;z-index:40;font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
.esme-top a{color:#C8CDD6;display:flex}
.esme-top a:hover{color:#FFFFFF}
.esme-geo{display:inline-flex !important;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:600;white-space:nowrap}
.esme-geo img{width:20px;height:14px;object-fit:cover;border-radius:2px}
.esme-geo:hover{background:rgba(255,255,255,.16)}
.esme-bar{background:#FFFFFF;border-bottom:1px solid #E4E7EC;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.esme-nav{display:flex;align-items:center;gap:2px}
.esme-nl{display:inline-flex;align-items:center;gap:5px;padding:8px 9px;border-radius:6px;border:none;background:none;font-family:'Sora','Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:600;color:#14181D;cursor:pointer;text-decoration:none;white-space:nowrap}
.esme-nl:hover{background:#F2F4F7;color:#14181D;text-decoration:none}
.esme-nl.is-on{color:#1E4FA8}
.esme-caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.75}
.esme-dd{position:relative}
.esme-ddm{display:none;position:absolute;left:0;top:100%;padding-top:8px;z-index:60}
.esme-dd:hover .esme-ddm,.esme-dd:focus-within .esme-ddm{display:block}
.esme-ddp{min-width:250px;background:#FFFFFF;border:1px solid #EAECF0;border-radius:12px;box-shadow:0 12px 32px -12px rgba(16,24,40,.25);padding:8px}
.esme-ddi{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:500;color:#14181D;text-decoration:none}
.esme-ddi:hover{background:#F5F7FA;color:#1E4FA8;text-decoration:none}
.esme-ict{flex:none;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.esme-ddi:hover .esme-ict{transform:scale(1.06)}
.esme-new{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:4px;background:#FFC72C;color:#101828;font-family:'Sora',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
.esme-ddall{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;padding:11px;border-top:1px solid #EAECF0;font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:#1E4FA8;text-decoration:none;border-radius:0 0 8px 8px}
.esme-ddall:hover{background:#F5F7FA;text-decoration:none}
.esme-ddi small{display:block;font-size:12.5px;font-weight:400;color:#5A6470;margin-top:2px}
.esme-search{display:flex;align-items:center;gap:8px;height:40px;width:170px;padding:0 12px;border:1px solid #D0D5DD;border-radius:8px;background:#F9FAFB;color:#667085}
.esme-search:focus-within{border-color:#1E4FA8;background:#FFFFFF;box-shadow:0 0 0 3px rgba(30,79,168,.12)}
.esme-search input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:14px;color:#14181D}
.esme-row{flex-wrap:nowrap}
.esme-logo svg{transition:transform .4s ease}
.esme-logo:hover svg{transform:rotate(30deg)}
.esme-row .esme-btn{flex:none}
@media (max-width: 1360px){.esme-search{display:none}}
@media (max-width: 1200px){.esme-adv{display:none}}
@media (max-width: 1060px){.esme-logo svg{width:36px !important;height:36px !important}.esme-logo>span{font-size:25px !important}.esme-nl{padding:8px 7px}}
@media (max-width: 900px){.esme-row{flex-wrap:wrap}.esme-nav{order:3;width:100%;overflow-x:auto}}
</style>
</helmet>
<header class="esme-hdr">
<div class="esme-top" style="background: #101828; color: #C8CDD6; font-size: 12.5px">
<div style="max-width: 1232px; height: 37px; box-sizing: border-box; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<span style="display: flex; align-items: center; gap: 14px; white-space: nowrap; overflow: hidden"><strong style="color: #FFFFFF; font-weight: 600">{{today}}</strong><span aria-hidden="true" style="width: 1px; height: 14px; background: rgba(255,255,255,.25)"></span><span>Europe’s platform for small-business insight</span></span>
<a href="{{geoHref}}" class="esme-geo" title="{{geoTitle}}"><sc-if value="{{hasGeo}}" hint-placeholder-val="{{ false }}"><img src="{{geoFlag}}" alt="" width="20" height="14"></sc-if><sc-if value="{{noGeo}}" hint-placeholder-val="{{ true }}"><span dc-html="{{pinIcon}}"></span></sc-if><span>{{geoLabel}}</span><span style="opacity: .6">· {{geoAction}}</span></a>
</div>
</div>
<div class="esme-bar">
<div class="esme-row" style="max-width: 1232px; min-height: 80px; box-sizing: border-box; margin: 0 auto; padding: 12px 32px; display: flex; align-items: center; gap: 12px 14px">
<a href="Main.dc.html" aria-label="European SME home" class="esme-logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none">
<svg aria-hidden="true" viewBox="0 0 100 100" style="width: 42px; height: 42px; flex: none"><circle cx="50" cy="50" r="47.5" fill="#003399" stroke="#FFCC00" stroke-width="3"/><g fill="#FFCC00"><polygon points="81.00,43.80 82.47,47.98 86.90,48.08 83.38,50.77 84.64,55.02 81.00,52.50 77.36,55.02 78.62,50.77 75.10,48.08 79.53,47.98"/><polygon points="76.85,59.30 78.32,63.48 82.74,63.58 79.22,66.27 80.49,70.52 76.85,68.00 73.20,70.52 74.47,66.27 70.95,63.58 75.38,63.48"/><polygon points="65.50,70.65 66.97,74.82 71.40,74.93 67.88,77.62 69.14,81.86 65.50,79.35 61.86,81.86 63.12,77.62 59.60,74.93 64.03,74.82"/><polygon points="50.00,74.80 51.47,78.98 55.90,79.08 52.38,81.77 53.64,86.02 50.00,83.50 46.36,86.02 47.62,81.77 44.10,79.08 48.53,78.98"/><polygon points="34.50,70.65 35.97,74.82 40.40,74.93 36.88,77.62 38.14,81.86 34.50,79.35 30.86,81.86 32.12,77.62 28.60,74.93 33.03,74.82"/><polygon points="23.15,59.30 24.62,63.48 29.05,63.58 25.53,66.27 26.80,70.52 23.15,68.00 19.51,70.52 20.78,66.27 17.26,63.58 21.68,63.48"/><polygon points="19.00,43.80 20.47,47.98 24.90,48.08 21.38,50.77 22.64,55.02 19.00,52.50 15.36,55.02 16.62,50.77 13.10,48.08 17.53,47.98"/><polygon points="23.15,28.30 24.62,32.48 29.05,32.58 25.53,35.27 26.80,39.52 23.15,37.00 19.51,39.52 20.78,35.27 17.26,32.58 21.68,32.48"/><polygon points="34.50,16.95 35.97,21.13 40.40,21.24 36.88,23.93 38.14,28.17 34.50,25.65 30.86,28.17 32.12,23.93 28.60,21.24 33.03,21.13"/><polygon points="50.00,12.80 51.47,16.98 55.90,17.08 52.38,19.77 53.64,24.02 50.00,21.50 46.36,24.02 47.62,19.77 44.10,17.08 48.53,16.98"/><polygon points="65.50,16.95 66.97,21.13 71.40,21.24 67.88,23.93 69.14,28.17 65.50,25.65 61.86,28.17 63.12,23.93 59.60,21.24 64.03,21.13"/><polygon points="76.85,28.30 78.32,32.48 82.74,32.58 79.22,35.27 80.49,39.52 76.85,37.00 73.20,39.52 74.47,35.27 70.95,32.58 75.38,32.48"/></g></svg>
<span style="font-family: 'League Spartan', 'Sora', Arial, sans-serif; font-weight: 800; font-size: 29px; line-height: 1; letter-spacing: -0.005em; padding-top: 4px; white-space: nowrap"><span style="color: #003399">EUROPEAN</span><span style="color: #FFCC00; margin-left: 6px">SME</span></span>
</a>
<nav aria-label="Main" class="esme-nav">
<a class="esme-nl {{latestOn}}" href="Articles.dc.html">Latest</a>
<div class="esme-dd">
<button type="button" class="esme-nl {{sectionsOn}}" aria-haspopup="true">Sections <span class="esme-caret"></span></button>
<div class="esme-ddm"><div class="esme-ddp" style="min-width: 300px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="7">
<a class="esme-ddi" href="{{s.href}}"><span class="esme-ict" style="color: {{s.color}}; background: {{s.tint}}" dc-html="{{s.icon}}"></span><span><strong style="font-weight: 600">{{s.label}}</strong><small>{{s.desc}}</small></span></a>
</sc-for>
</div></div>
</div>
<div class="esme-dd">
<button type="button" class="esme-nl {{toolsOn}}" aria-haspopup="true">Tools <span class="esme-caret"></span></button>
<div class="esme-ddm"><div class="esme-ddp" style="min-width: 360px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
<a class="esme-ddi" href="{{t.href}}"><span class="esme-ict" style="color: {{t.tone}}; background: {{t.tint}}" dc-html="{{t.icon}}"></span><span style="flex: 1 1 auto"><strong style="font-weight: 600">{{t.name}}</strong><sc-if value="{{t.isNew}}" hint-placeholder-val="{{ false }}"><span class="esme-new">New</span></sc-if><small>{{t.short}}</small></span></a>
</sc-for>
<a class="esme-ddall" href="Tools.dc.html"><span dc-html="{{gridIcon}}"></span>See all tools</a>
</div></div>
</div>
<a class="esme-nl {{countriesOn}}" href="Countries.dc.html">Countries</a>
<a class="esme-nl {{policyOn}}" href="Articles.dc.html?section=policy">EU Policy</a>
</nav>
<span style="flex: 1 1 0"></span>
<form class="esme-search" action="Articles.dc.html" method="get" role="search">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="hdr-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search articles</label>
<input id="hdr-q" name="q" type="search" placeholder="Search the site">
</form>
<a class="esme-btn esme-btn--blue esme-adv" href="https://europeansme.eu/contact-us/">Advertise With Us</a>
<a class="esme-btn esme-btn--gold" href="Main.dc.html#newsletter">Subscribe Free</a>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["none","Articles","Funding","Growth","Money","Marketing","Hiring","Tech","Policy","Countries","Tools"],"default":"none"},"$preview":{"width":1440,"height":360}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { geo: null }; }
  componentDidMount() { if (typeof ESME !== 'undefined') ESME.detectCountry().then((g) => { if (g) this.setState({ geo: g }); }); }
  renderVals() {
    const active = this.props.active ?? 'none';
    const E = typeof ESME !== 'undefined' ? ESME : null;
    const S = (E && E.sections) || {};
    const sections = Object.keys(S).map((k) => ({ label: S[k].label, desc: S[k].desc, color: S[k].color, tint: S[k].color + '1A', icon: E.icon(k, 18), href: 'Articles.dc.html?section=' + k }));
    const inSection = ['Funding', 'Growth', 'Money', 'Marketing', 'Hiring', 'Tech'].indexOf(active) > -1;
    return {
      today: new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
      sections,
      tools: E ? E.tools.map((t) => Object.assign({}, t, { icon: E.icon(t.icon, 18), tint: t.tone + '14', isNew: !!t.isNew })) : [],
      gridIcon: E ? E.icon('grid', 15) : '',
      ...(() => {
        const g = this.state.geo, c = g && E ? E.country(g.code) : null;
        return { hasGeo: !!c, noGeo: !c, geoFlag: c ? c.flag : '', geoLabel: c ? c.name : 'Choose your country', geoAction: c ? 'Change' : 'All 27',
          geoHref: c ? 'Country.dc.html?country=' + c.code : 'Countries.dc.html', pinIcon: E ? E.icon('pin', 14) : '',
          geoTitle: c ? (g.source === 'cloudflare' ? 'Detected from your location' : g.source === 'browser' ? 'Detected from your browser settings' : 'Your saved country') : 'Pick a country for local news' };
      })(),
      latestOn: active === 'Articles' ? 'is-on' : '',
      sectionsOn: inSection ? 'is-on' : '',
      toolsOn: active === 'Tools' ? 'is-on' : '',
      countriesOn: active === 'Countries' ? 'is-on' : '',
      policyOn: active === 'Policy' ? 'is-on' : ''
    };
  }
}
</script>
</body>
</html>
